<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Freedom Mission" />
<title>Freedom Mission</title>
<style>
/* ==========================================================================
   FREEDOM MISSION — tokens & base
   Matte black, off-white, restrained gold. Nothing else.
   ========================================================================== */

:root {
  --bg: #000000;
  --bg-elev: #0a0a0b;
  --surface: #0e0e10;
  --surface-2: #141416;

  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.12);

  --text: #f2f1ee;
  --text-2: rgba(242, 241, 238, 0.62);
  --text-3: rgba(242, 241, 238, 0.4);
  --text-4: rgba(242, 241, 238, 0.24);

  --gold: #b99c63;
  --gold-dim: rgba(185, 156, 99, 0.38);

  --r-md: 18px;
  --r-lg: 24px;
  --gap: 10px;
  --pad: 22px;

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);

  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --nav-h: 62px;

  color-scheme: dark;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior-y: none;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
    'Helvetica Neue', Helvetica, Inter, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

img {
  display: block;
  max-width: 100%;
}

::selection {
  background: var(--gold-dim);
}

/* ---------- shell ---------- */

.app {
  position: relative;
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  overflow-x: hidden;
}

@media (min-width: 640px) {
  body {
    background: #050505;
  }
  .app {
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
}

.scroll {
  padding: calc(var(--sat) + 30px) var(--pad)
    calc(var(--nav-h) + var(--sab) + 40px);
  /* `backwards`, not `both`: `both` leaves an identity transform behind,
     which would make this the containing block for anything fixed. */
  animation: rise 0.34s var(--ease) backwards;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}

@keyframes fade {
  from {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------- type ---------- */

.kicker {
  font-size: 9.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-4);
  font-weight: 500;
}

.label {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 500;
}

.num {
  font-size: 27px;
  line-height: 1.05;
  letter-spacing: -0.03em;
  font-weight: 500;
}

.num-lg {
  font-size: 40px;
  line-height: 1;
  letter-spacing: -0.04em;
  font-weight: 500;
}

.num-sm {
  font-size: 15px;
  letter-spacing: -0.01em;
  font-weight: 500;
}

.muted {
  color: var(--text-2);
}

.faint {
  color: var(--text-3);
}

/* ---------- header ---------- */

.screen-head {
  margin-bottom: 30px;
}

.screen-title {
  font-size: 30px;
  letter-spacing: -0.035em;
  font-weight: 500;
  margin: 0;
  line-height: 1;
}

.brand-title {
  font-size: 19px;
  font-weight: 500;
  letter-spacing: 0.2em;
  margin: 0;
  line-height: 1.2;
}

.brand-sub {
  margin-top: 11px;
}

/* ---------- section ---------- */

.section {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin: 38px 0 13px;
}

.section .rule {
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* ---------- card ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 17px 18px;
}

.card-lg {
  border-radius: var(--r-lg);
  padding: 20px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.divided > * + * {
  border-top: 1px solid var(--line);
}

/* ---------- stat ---------- */

.stat {
  min-height: 92px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 16px;
}

/* ---------- progress ---------- */

.bar {
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.bar > i {
  display: block;
  height: 100%;
  border-radius: 2px;
  background: var(--text);
  transform-origin: left;
  animation: grow 0.7s var(--ease) both;
}

.bar.gold > i {
  background: var(--gold);
}

@keyframes grow {
  from {
    transform: scaleX(0);
  }
}

.bar-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
  gap: 10px;
}

/* ---------- roadmap ---------- */

.road {
  position: relative;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.08);
  margin: 4px 0 0;
}

.road > i {
  display: block;
  height: 100%;
  border-radius: 2px;
  background: var(--gold);
  animation: grow 0.8s var(--ease) both;
  transform-origin: left;
}

.road b {
  position: absolute;
  top: 50%;
  width: 7px;
  height: 7px;
  margin: -3.5px 0 0 -3.5px;
  border-radius: 50%;
  background: #0a0a0b;
  border: 1px solid var(--line-strong);
}

.road b.on {
  background: var(--gold);
  border-color: var(--gold);
}

.road.dim > i {
  background: var(--text-3);
}

.road-marks {
  display: flex;
  margin-top: 14px;
}

.road-marks span {
  flex: 1;
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-4);
}

.road-marks span.on {
  color: var(--gold);
}

/* milestone names are longer than money labels — tighten so they hold one line */
.road-marks.wide span {
  font-size: 8.5px;
  letter-spacing: 0.02em;
  padding: 0 2px;
  line-height: 1.3;
}

/* ---------- pill ---------- */

.pill {
  display: inline-flex;
  align-items: center;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 600;
  border: 1px solid var(--line-strong);
  color: var(--text-3);
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  white-space: nowrap;
}

.pill.on {
  color: var(--gold);
  border-color: var(--gold-dim);
}

.pill.done {
  color: var(--text);
  border-color: rgba(255, 255, 255, 0.3);
}

/* ---------- rows ---------- */

.line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 0;
}

.line:first-child {
  padding-top: 0;
}

.line:last-child {
  padding-bottom: 0;
}

.line .n {
  font-size: 15px;
  letter-spacing: -0.01em;
}

.line .a {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.line.total {
  border-top: 1px solid var(--line-strong);
  margin-top: 4px;
  padding-top: 16px;
}

.line.total .n {
  color: var(--text-3);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.line.total .a {
  font-size: 19px;
  letter-spacing: -0.02em;
}

.kv {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0;
}

.kv:first-child {
  padding-top: 0;
}

.kv:last-child {
  padding-bottom: 0;
}

.kv .v {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
  text-align: right;
}

/* an author rule must never out-rank the hidden attribute on a fallback */
[hidden] {
  display: none !important;
}

/* ---------- brand mark ---------- */

.brand-logo {
  display: block;
  height: auto;
}

.lock-brand .brand-logo {
  width: 225px;
  max-width: 72%;
  margin: 0 auto;
}

.screen-head .brand-logo {
  width: 196px;
  max-width: 64%;
}

.brand-head {
  text-align: center;
}

.brand-head .brand-logo {
  margin: 0 auto;
}

/* the logo carries its own spacing; the typed fallback keeps the tracking */
h1.has-logo {
  letter-spacing: 0;
  text-indent: 0;
}

.lock-brand .brand-text {
  display: inline-block;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
}

.screen-head .brand-text {
  letter-spacing: 0.2em;
}

/* ---------- business logo ---------- */

.biz-logo {
  display: block;
  height: 20px;   /* a one-line wordmark; taller lockups set their own via logoHeight */
  width: auto;
}

.biz-name {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.04em;
}

/* ---------- photo ---------- */

.vimg {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: linear-gradient(150deg, #191a1d 0%, #0b0b0c 62%, #121214 100%);
}

.vimg img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.6s var(--ease);
}

.vimg img.in {
  opacity: 1;
}

.vimg .ph {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.14);
}

.vimg .scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    rgba(0, 0, 0, 0.92) 0%,
    rgba(0, 0, 0, 0.5) 38%,
    rgba(0, 0, 0, 0.04) 76%
  );
}

.vimg.locked img {
  filter: grayscale(0.85) brightness(0.6);
}

/* ---------- goal card ---------- */

.goal {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--surface);
}

.goal-media {
  height: 210px;
}

.goal-media.band {
  height: 128px;
}

.goal-media.life {
  height: 156px;
}

.goal-over {
  position: absolute;
  inset: auto 0 0 0;
  padding: 18px;
  text-shadow: 0 1px 16px rgba(0, 0, 0, 0.65);
}

.goal-over .kicker {
  color: rgba(255, 255, 255, 0.58);
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8);
}

.goal-top {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 2;
}

.goal-body {
  padding: 18px;
  border-top: 1px solid var(--line);
}

/* ---------- unlock list ---------- */

.unlock {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.unlock li {
  display: flex;
  gap: 11px;
  align-items: flex-start;
  font-size: 13.5px;
  color: var(--text-2);
  line-height: 1.35;
}

.unlock .dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--gold-dim);
  flex: none;
  margin-top: 8px;
}

/* ---------- next action ---------- */

.action {
  border-radius: var(--r-md);
  border: 1px solid var(--line-strong);
  background: var(--surface-2);
  padding: 14px 15px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.action .arrow {
  color: var(--gold);
  font-size: 13px;
  line-height: 1.35;
  flex: none;
}

.action .txt {
  font-size: 14.5px;
  letter-spacing: -0.01em;
  line-height: 1.35;
}

/* ---------- bottom nav ---------- */

.nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 430px;
  z-index: 40;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 9px 6px calc(7px + var(--sab));
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  border-top: 1px solid var(--line);
}

.nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 6px 2px;
  color: var(--text-4);
  transition: color 0.2s var(--ease);
}

.nav button.on {
  color: var(--text);
}

.nav button svg {
  width: 19px;
  height: 19px;
}

.nav button span {
  font-size: 8.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 500;
}

/* ---------- lock ---------- */

.lock {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: calc(var(--sat) + 104px) 30px calc(var(--sab) + 60px);
  animation: fade 0.5s var(--ease) both;
}

.lock-brand {
  width: 100%;      /* so the logo's max-width resolves against the screen,
                       not against a box that shrank to fit the logo */
  text-align: center;
}

.lock-brand h1 {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  margin: 0;
}

.lock-brand p {
  margin: 16px 0 0;
  font-size: 9.5px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--text-4);
}

.lock-brand .hair {
  width: 26px;
  height: 1px;
  background: var(--gold-dim);
  margin: 26px auto 0;
}

.dots {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-bottom: 34px;
}

.dots i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  transition: background 0.2s var(--ease), border-color 0.2s var(--ease),
    transform 0.2s var(--ease);
}

.dots i.on {
  background: var(--text);
  border-color: var(--text);
  transform: scale(1.06);
}

.dots.err i {
  border-color: #c9705f;
  background: transparent;
}

.shake {
  animation: shake 0.42s var(--ease);
}

@keyframes shake {
  10%, 90% { transform: translateX(-2px); }
  20%, 80% { transform: translateX(4px); }
  30%, 50%, 70% { transform: translateX(-6px); }
  40%, 60% { transform: translateX(6px); }
}

.pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  width: 100%;
  max-width: 268px;
  margin: 0 auto;
}

.key {
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.016);
  display: grid;
  place-items: center;
  font-size: 25px;
  font-weight: 300;
  letter-spacing: -0.02em;
  transition: background 0.15s var(--ease), transform 0.12s var(--ease);
}

.key:active {
  background: rgba(255, 255, 255, 0.1);
  transform: scale(0.94);
}

.key.ghost {
  border-color: transparent;
  background: none;
  font-size: 16px;
  color: var(--text-3);
}

.lock-foot {
  margin-top: 30px;
  text-align: center;
  min-height: 34px;
}

.enter {
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 11px 34px;
  font-size: 10px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  transition: opacity 0.2s var(--ease), background 0.2s var(--ease);
}

.enter:disabled {
  opacity: 0.26;
}

.enter:not(:disabled):active {
  background: rgba(255, 255, 255, 0.08);
}

.err-msg {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #c9705f;
  margin-top: 14px;
}
</style>
</head>

<script>

(function () {
  'use strict';

  /* ======================================================================
     1. CONFIG
     ====================================================================== */

  // Local privacy screen, not authentication. There is no server.
  var PIN = '7777';

  /* ======================================================================
     2. DATA — the only thing you edit

     Money fields are `null` on purpose: no invented figures. Replace a null
     with a plain number (no quotes, no commas) and the whole app updates —
     progress bars, the roadmap and every total follow automatically.
     Until then the screen shows a dash.

     Photos: drop a .jpg in the images/ folder next to this file using the
     name below and it replaces the stock placeholder. No code change.
     ====================================================================== */

  var BRAND = {
    name: 'FREEDOM MISSION',
    line: 'Build the life.',
    logo: IMG.freedommission   // falls back to the name in type
  };

  /* What you actually own and owe. Edit these lines, never a total — every
     figure on Home is derived from them, so the parts can never disagree with
     the sum.

       liquid: true     cash you could spend this week
       shortTerm: true  debt due inside a year

     `estimatedEquity` is deliberately kept out of the confirmed net worth. A
     business valuation is a guess; confirmed wealth is not. */
  var BALANCE = {
    assets: [
      { label: 'Camaro', value: 18000 },
      { label: 'Cash savings', value: 3000, liquid: true }
    ],
    debts: [
      { label: 'Credit card', value: 6000, shortTerm: true }
    ],
    estimatedEquity: [
      { label: 'Verano Desert', value: 10000 }
    ],
    monthlyIncome: 4000
  };

  var MONEY = (function () {
    function total(rows, only) {
      return rows.reduce(function (s, r) {
        return s + (only && !r[only] ? 0 : r.value);
      }, 0);
    }
    var assets = total(BALANCE.assets);
    var debt = total(BALANCE.debts);
    var netWorth = assets - debt;
    var equity = total(BALANCE.estimatedEquity);
    return {
      assets: assets,
      debt: debt,
      netWorth: netWorth,
      liquidNetWorth: total(BALANCE.assets, 'liquid') - total(BALANCE.debts, 'shortTerm'),
      estimatedEquity: equity,
      estimatedTotal: netWorth + equity,
      monthlyIncome: BALANCE.monthlyIncome
    };
  })();

  var LIQUIDITY_LEVELS = [0, 10000, 25000];   // $25K is the ceiling

  var GOALS = [

  var VISION = [

  function money(n, compact) {
    if (n === null || n === undefined) return '$—';

    var a = Math.abs(n);
    if (compact && a >= 1000) {

      if (v >= 1000) {
        var m = v / 1000;
        return sign + '$' + (v % 1000 === 0 ? m.toFixed(0) : m.toFixed(1)) + 'M';
      }
      return sign + '$' + Math.round(v) + 'K';
    }

  }

  }

  function num(n) {
    return n === null || n === undefined ? 0 : n;
  }

  function clamp01(n) {
    return Math.max(0, Math.min(1, n));
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // sessionStorage throws on some file:// origins — never let that break boot.
  var memory = {};
  var store = {
    get: function (k) {
      try { return sessionStorage.getItem(k); } catch (e) { return memory[k] || null; }
    },
    set: function (k, v) {
      try { sessionStorage.setItem(k, v); } catch (e) { memory[k] = v; }
    }
  };

  /* ======================================================================
     4. PIECES
     ====================================================================== */

  function section(title) {
    return '<div class="section"><span class="label">' + esc(title) +
      '</span><span class="rule"></span></div>';
  }

  function bar(value, gold) {
    return '<div class="bar' + (gold ? ' gold' : '') + '"><i style="width:' +
      (clamp01(value) * 100) + '%"></i></div>';
  }

  function stat(label, value, opts) {
    opts = opts || {};
    return '<div class="card stat"><span class="label">' + esc(label) + '</span>' +
      '<div><div class="num">' + (opts.text || money(value)) + '</div>' +
      (opts.note
        ? '<div class="kicker" style="margin-top:7px">' + esc(opts.note) + '</div>'
        : '') +
      '</div></div>';
  }

  function kv(k, v) {
    return '<div class="kv"><span class="label">' + esc(k) + '</span>' +
      '<span class="v">' + v + '</span></div>';
  }

  /* The brand mark, used on the lock screen and the Home header. */
  function brandMark() {
    if (!BRAND.logo) return esc(BRAND.name);
    return '<img class="brand-logo" src="' + esc(BRAND.logo) + '" alt="' +
      esc(BRAND.name) + '" onerror="FM.logoFail(this)">' +
      '<span class="brand-text" hidden>' + esc(BRAND.name) + '</span>';
  }

  /* Wordmark if the file is there, the name in type if it isn't. */
  function logo(b) {
    if (!b.logo) return '<span class="biz-name">' + esc(b.name) + '</span>';
    return '<img class="biz-logo" src="' + esc(b.logo) + '" alt="' + esc(b.name) + '"' +
      (b.logoHeight ? ' style="height:' + b.logoHeight + 'px"' : '') +
      ' onerror="FM.logoFail(this)">' +
      '<span class="biz-name" hidden>' + esc(b.name) + '</span>';
  }

  function action(text) {
    return '<div class="action"><span class="arrow">→</span>' +
      '<span class="txt">' + esc(text) + '</span></div>';
  }

  /* ---- photo: local file, then stock, then a quiet typographic slug ---- */

  function photo(image, alt, opts) {
    opts = opts || {};
    var cls = 'vimg' + (opts.dim ? ' locked' : '') + (opts.className ? ' ' + opts.className : '');
    return '<div class="' + cls + '">' +
      '<img src="' + esc(image.src) + '" alt="' + esc(alt) + '" loading="lazy" ' +
      'decoding="async" data-step="0" data-fb="https://picsum.photos/seed/' +
      encodeURIComponent(image.seed) + '/900/700" ' +
      'onload="FM.imgOk(this)" onerror="FM.imgErr(this)">' +
      '<span class="ph">' + esc(alt) + '</span>' +
      '<span class="scrim"></span>' +
      (opts.children || '') +
      '</div>';
  }

  // Exposed for the inline onload/onerror attributes above.
  window.FM = {
    imgOk: function (el) {
      el.classList.add('in');
      var ph = el.parentElement.querySelector('.ph');
      if (ph) ph.parentElement.removeChild(ph);
    },
    imgErr: function (el) {
      if (el.getAttribute('data-step') === '0') {
        el.setAttribute('data-step', '1');
        el.src = el.getAttribute('data-fb');
      }
      // second failure: stay quiet, the placeholder is already behind it
    },
    logoFail: function (el) {
      el.style.display = 'none';
      if (el.nextElementSibling) el.nextElementSibling.hidden = false;
    }
  };

  /* ======================================================================
     5. SCREENS
     ====================================================================== */

  function screenHome() {
    var nw = MONEY.netWorth;
    var progress = clamp01(nw / MISSION.target);

    var head =
      '<header class="screen-head brand-head">' +
      '<h1 class="brand-title' + (BRAND.logo ? ' has-logo' : '') + '">' +
      brandMark() + '</h1>' +
      '<div class="brand-sub"><span class="kicker">' + esc(BRAND.line) + '</span></div>' +
      '</header>';

    var stats =
      '<div class="grid-2">' +
      stat('Net Worth', MONEY.netWorth, { note: 'Confirmed' }) +
      stat('Liquid Net Worth', MONEY.liquidNetWorth) +
      stat('Monthly Income', MONEY.monthlyIncome) +
      stat('Debt', MONEY.debt) +
      '</div>';

    // Estimates sit below the grid, never inside it: a guess should not carry
    // the same visual weight as a confirmed figure.
    function estRow(label, value) {
      return '<div class="row-between" style="margin-top:14px;padding:0 4px">' +
        '<span class="kicker">' + esc(label) + '</span>' +
        '<span class="kicker" style="color:var(--text-3)">~' + money(value) +
        '</span></div>';
    }

    var estimated =
      estRow('Business equity (estimated)', MONEY.estimatedEquity) +
      estRow('Estimated total net worth', MONEY.estimatedTotal);

    var mission =
      '<div class="card card-lg">' +
      '<div class="num" style="margin-bottom:22px">' + esc(MISSION.name) + '</div>' +
      bar(progress, true) +
      '<div class="row-between" style="margin-top:12px">' +
      '<span class="kicker">' + money(nw) + '</span>' +
      '<span class="kicker" style="color:var(--gold)">' + pct(progress) + '</span>' +
      '<span class="kicker">' + money(MISSION.target) + '</span>' +
      '</div></div>';

    // Secondary on purpose: smaller type, no section header, dimmed track.
    var liq = MONEY.liquidNetWorth;
    var liqP = levelProgress(liq, LIQUIDITY_LEVELS);
    var liqDots = LIQUIDITY_LEVELS.map(function (l, i) {
      return '<b class="' + (liq >= l ? 'on' : '') + '" style="left:' +
        ((i + 1) / LIQUIDITY_LEVELS.length * 100) + '%"></b>';
    }).join('');
    var liqMarks = LIQUIDITY_LEVELS.map(function (l) {
      return '<span class="' + (liq >= l ? 'on' : '') + '">' + money(l, true) + '</span>';
    }).join('');

    var liquidity =
      '<div class="card" style="margin-top:10px">' +
      '<div class="row-between" style="align-items:baseline">' +
      '<span class="label">Liquid net worth</span>' +
      '<span class="num-sm">' + money(liq) + '</span></div>' +
      '<div style="margin-top:16px">' +
      '<div class="road dim"><i style="width:' + (liqP * 100) + '%"></i>' + liqDots + '</div>' +
      '<div class="road-marks">' + liqMarks + '</div></div></div>';

    var unlock =
      '<div class="goal">' +
      photo(NEXT_UNLOCK.image, NEXT_UNLOCK.name, {
        className: 'goal-media band',
        dim: true,
        children: '<div class="goal-over"><div style="font-size:19px;font-weight:500;' +
          'letter-spacing:-0.02em">' + esc(NEXT_UNLOCK.name) + '</div></div>'
      }) + '</div>';

    return '<div class="scroll">' + head + stats + estimated +
      section(MISSION.label) + mission + liquidity +
      section('Next unlock') + unlock +
      '</div>';
  }

  /* ---------------------------------------------------------------- */

  // Equal spacing between milestones, so the bar reads instantly instead of
  // being technically proportional and visually useless at the low end.
  function levelProgress(v, levels) {
    if (v === null || v === undefined) return 0;
    var prev = 0;
    for (var i = 0; i < levels.length; i++) {
      if (v < levels[i]) {
        if (levels[i] <= prev) return i / levels.length; // below the first rung
        return (i + clamp01((v - prev) / (levels[i] - prev))) / levels.length;
      }
      prev = levels[i];
    }
    return 1;
  }

  function screenWealth() {
    var nw = num(MONEY.netWorth);
    var p = levelProgress(nw, ROADMAP);

    var dots = ROADMAP.map(function (l, i) {
      return '<b class="' + (nw >= l ? 'on' : '') + '" style="left:' +
        ((i + 1) / ROADMAP.length * 100) + '%"></b>';
    }).join('');

    var marks = ROADMAP.map(function (l) {
      return '<span class="' + (nw >= l ? 'on' : '') + '">' + money(l, true) + '</span>';
    }).join('');

    var roadmap =
      '<div class="card card-lg">' +
      '<div class="road"><i style="width:' + (p * 100) + '%"></i>' + dots + '</div>' +
      '<div class="road-marks">' + marks + '</div></div>';

    var cards = GOALS.map(function (g) {
      return '<div class="goal">' +
        '<div class="goal-top"><span class="pill">' + esc(g.status) + '</span></div>' +
        photo(g.image, g.name, {
          className: 'goal-media',
          dim: true,
          children:
            '<div class="goal-over">' +
            '<div style="font-size:21px;font-weight:500;letter-spacing:-0.025em">' +
            esc(g.name) + '</div>' +
            '<div class="kicker" style="margin-top:9px">Target ' + money(g.price) + '</div>' +
            '</div>'
        }) +
        '<div class="goal-body">' +
        '<div class="label" style="margin-bottom:14px">Unlock requirements</div>' +
        '<ul class="unlock">' + g.unlock.map(function (u) {
          return '<li><i class="dot"></i><span>' + esc(u) + '</span></li>';
        }).join('') + '</ul></div></div>';
    }).join('');

    return '<div class="scroll">' +
      '<header class="screen-head"><h1 class="screen-title">Wealth</h1></header>' +
      section('Net worth roadmap') + roadmap +
      section('Goals') + '<div class="stack">' + cards + '</div>' +
      '</div>';
  }

  /* ---------------------------------------------------------------- */

  function visionValue(g, v) {
    if (g.kind === 'money') return money(v); // money() already renders null as $—
    if (v === null || v === undefined) return '\u2014';
    if (g.kind === 'kg') return v + ' KG';
    return String(v);
  }

  var VISION_STATUS = {
    not_started: 'Not started',
    in_progress: 'In progress',
    completed: 'Completed'
  };

  function visionStatus(g) {
    if (g.kind === 'status') return g.status;
    if (g.current === null || g.current === undefined) return 'not_started';
    var hit = g.direction === 'down' ? g.current <= g.target : g.current >= g.target;
    if (hit) return 'completed';
    return g.current === 0 ? 'not_started' : 'in_progress';
  }

  // Returns null when no honest bar can be drawn — a falling number with no
  // starting point has no meaningful percentage.
  function visionProgress(g) {
    if (g.kind === 'status') return null;
    if (g.direction === 'down') {
      // check the baseline before anything else: with no starting weight there
      // is no percentage to draw, and a 0% bar would claim no progress rather
      // than admit we cannot know
      if (g.from === null || g.from === undefined || g.from <= g.target) return null;
      if (g.current === null || g.current === undefined) return 0;
      return clamp01((g.from - g.current) / (g.from - g.target));
    }
    if (g.current === null || g.current === undefined) return 0;
    return clamp01(g.current / g.target);
  }

  function screenLife() {
    var cards = VISION.map(function (g) {
      var st = visionStatus(g);
      var p = visionProgress(g);
      var tone = st === 'completed' ? 'done' : st === 'in_progress' ? 'on' : '';

      var headline = g.kind === 'status'
        ? esc(g.goal)
        : visionValue(g, g.target) +
          (g.suffix ? ' <span class="faint" style="font-size:14px;letter-spacing:0">' +
            esc(g.suffix) + '</span>' : '');

      var body = g.kind === 'status'
        ? ''
        : '<div class="divided">' +
          kv('Current', visionValue(g, g.current)) +
          kv('Target', visionValue(g, g.target)) +
          '</div>' +
          (p === null ? '' : '<div style="margin-top:16px">' + bar(p, true) + '</div>');

      return '<div class="goal">' +
        '<div class="goal-top"><span class="pill ' + tone + '">' +
        VISION_STATUS[st] + '</span></div>' +
        photo(g.image, g.name, {
          className: 'goal-media life',
          dim: true,   // same locked treatment as the Wealth goal cards
          children:
            '<div class="goal-over">' +
            '<div class="kicker" style="margin-bottom:8px">' + esc(g.name) + '</div>' +
            '<div style="font-size:21px;font-weight:500;letter-spacing:-0.025em;' +
            'line-height:1.2">' + headline + '</div></div>'
        }) +
        (body ? '<div class="goal-body">' + body + '</div>' : '') +
        '</div>';
    }).join('');

    var total = PROTECT.reduce(function (s, p) { return s + p.monthly; }, 0);

    var protect = '<div class="card card-lg">' +
      PROTECT.map(function (p) {
        return '<div class="line"><span class="n">' + esc(p.name) + '</span>' +
          '<span class="a">' + money(p.monthly) +
          '<span class="faint" style="font-size:12px"> / mo</span></span></div>';
      }).join('') +
      '<div class="line total"><span class="n">Total target</span>' +
      '<span class="a">' + money(total) +
      '<span class="faint" style="font-size:13px"> / mo</span></span></div>' +
      '</div>';

    return '<div class="scroll">' +
      '<header class="screen-head"><h1 class="screen-title">Life</h1>' +
      '<div class="brand-sub"><span class="kicker">12 month vision</span></div></header>' +
      '<div class="stack">' + cards + '</div>' +
      section('Protect') + protect +
      '</div>';
  }

  /* ---------------------------------------------------------------- */

  function milestoneDone(m, value) {
    return m.done !== undefined ? m.done : value >= m.at;
  }

  // Milestones are spaced evenly, not proportionally: the gap from 5 to 10
  // clients matters as much as the gap from 0 to 1, and even spacing is what
  // reads in a glance.
  function missionProgress(b) {
    var ms = b.milestones, n = ms.length, done = 0;
    while (done < n && milestoneDone(ms[done], b.value)) done++;
    if (done >= n) return 1;
    var cur = ms[done];
    if (cur.at === undefined) return done / n; // a hand-flipped gate earns no partial credit
    var prev = 0;
    for (var j = done - 1; j >= 0; j--) {
      if (ms[j].at !== undefined) { prev = ms[j].at; break; }
    }
    var frac = cur.at > prev ? (b.value - prev) / (cur.at - prev) : 0;
    return (done + clamp01(frac)) / n;
  }

  function currentMilestone(b) {
    for (var i = 0; i < b.milestones.length; i++) {
      if (!milestoneDone(b.milestones[i], b.value)) return b.milestones[i].name;
    }
    return 'Complete';
  }

  function screenBusiness() {
    var cards = BUSINESSES.map(function (b) {
      var p = missionProgress(b);
      var n = b.milestones.length;

      var dots = b.milestones.map(function (m, i) {
        return '<b class="' + (milestoneDone(m, b.value) ? 'on' : '') + '" style="left:' +
          ((i + 1) / n * 100) + '%"></b>';
      }).join('');

      var marks = b.milestones.map(function (m) {
        return '<span class="' + (milestoneDone(m, b.value) ? 'on' : '') + '">' +
          esc(m.name) + '</span>';
      }).join('');

      return '<div class="card card-lg">' +
        logo(b) +

        '<div class="label" style="margin-top:22px">Primary mission</div>' +
        '<div style="font-size:19px;font-weight:500;letter-spacing:-0.02em;margin-top:9px">' +
        esc(b.mission) + '</div>' +
        (b.countLabel
          ? '<div class="label" style="margin-top:22px">' + esc(b.countLabel) + '</div>'
          : '') +
        '<div class="num-lg" style="margin-top:' + (b.countLabel ? 9 : 16) + 'px">' + b.value +
        '<span class="faint" style="font-size:20px;letter-spacing:-0.02em"> / ' +
        b.target + '</span></div>' +

        '<div style="margin-top:26px">' +
        '<div class="road"><i style="width:' + (p * 100) + '%"></i>' + dots + '</div>' +
        '<div class="road-marks wide">' + marks + '</div></div>' +

        '<div class="divided" style="margin-top:28px">' +
        (b.showCurrentMilestone === false
          ? ''
          : kv('Current milestone', esc(currentMilestone(b)))) +
        b.money.map(function (m) {
          return kv(m.label, money(m.value) + (m.suffix
            ? '<span class="faint" style="font-size:12px"> ' + esc(m.suffix) + '</span>'
            : ''));
        }).join('') +
        '</div>' +

        '<div style="margin-top:20px">' +
        '<div class="label" style="margin-bottom:9px">' +
        esc(b.nextLabel || 'Next action') + '</div>' +
        action(b.action) + '</div>' +
        '</div>';
    }).join('');

    return '<div class="scroll">' +
      '<header class="screen-head">' +
      '<h1 class="brand-title">BUSINESS</h1>' +
      '<div class="brand-sub"><span class="kicker">Build the engines.</span></div>' +
      '</header>' +
      '<div class="stack">' + cards + '</div></div>';
  }

  var SCREENS = {
    home: screenHome,
    wealth: screenWealth,
    business: screenBusiness,
    life: screenLife
  };

  /* ======================================================================
     6. LOCK
     ====================================================================== */

  var code = '';
  var pinError = false;

  function lockScreen() {
    var dots = '';
    for (var i = 0; i < PIN_LENGTH; i++) {
      dots += '<i class="' + (i < code.length && !pinError ? 'on' : '') + '"></i>';
    }
    var keys = '';
    for (var k = 1; k <= 9; k++) {
      keys += '<button class="key" data-key="' + k + '">' + k + '</button>';
    }
    keys += '<span></span><button class="key" data-key="0">0</button>' +
      '<button class="key ghost" data-key="del" aria-label="Delete">⌫</button>';

    var foot = pinError
      ? '<div class="err-msg">Incorrect</div>'
      : '<button class="enter" data-key="enter"' +
      (code.length === PIN_LENGTH ? '' : ' disabled') + '>Enter</button>';

    return '<div class="lock">' +
      '<div class="lock-brand"><h1' + (BRAND.logo ? ' class="has-logo"' : '') + '>' +
      brandMark() + '</h1>' +
      '<p>' + esc(BRAND.line) + '</p><div class="hair"></div></div>' +
      '<div style="width:100%">' +
      '<div class="dots ' + (pinError ? 'err shake' : '') + '">' + dots + '</div>' +
      '<div class="pad">' + keys + '</div>' +
      '<div class="lock-foot">' + foot + '</div></div></div>';
  }

  function pinSubmit(value) {
    if (value === PIN) {
      store.set(SESSION_KEY, '1');
      unlocked = true;
      code = '';
      render();
    } else {
      pinError = true;
      render();
      setTimeout(function () {
        pinError = false;
        code = '';
        render();
      }, 620);
    }
  }

  function pinPush(d) {
    if (pinError || code.length >= PIN_LENGTH) return;
    code += d;
    render();
    if (code.length === PIN_LENGTH) {
      var snapshot = code;
      setTimeout(function () { pinSubmit(snapshot); }, 130);
    }
  }

  /* ======================================================================
     7. APP
     ====================================================================== */

  var ICONS = {
    home: '<path d="M3 11.2 12 4l9 7.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M5.5 10v9.5h13V10" stroke-linecap="round" stroke-linejoin="round"/>',
    wealth: '<path d="M6.2 4h11.6l3.2 5-9 11-9-11z" stroke-linejoin="round"/>' +
      '<path d="M3 9h18M9 9l3 11M15 9l-3 11M9 9l1.6-5M15 9l-1.6-5" stroke-linejoin="round"/>',
    business: '<path d="M4 20V13M10 20V8M16 20v-9M22 20V4" stroke-linecap="round"/>',
    life: '<circle cx="12" cy="8" r="3.4"/>' +
      '<path d="M4.8 20c.6-3.7 3.5-5.9 7.2-5.9s6.6 2.2 7.2 5.9" stroke-linecap="round"/>'
  };

  var TABS = [
    { id: 'home', label: 'Home' },
    { id: 'wealth', label: 'Wealth' },
    { id: 'business', label: 'Business' },
    { id: 'life', label: 'Life' }
  ];

  function navBar() {
    return '<nav class="nav">' + TABS.map(function (t) {
      return '<button class="' + (tab === t.id ? 'on' : '') + '" data-tab="' + t.id +
        '" aria-label="' + t.label + '"' + (tab === t.id ? ' aria-current="true"' : '') + '>' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">' +
        ICONS[t.id] + '</svg><span>' + t.label + '</span></button>';
    }).join('') + '</nav>';
  }

  var app = document.getElementById('app');
  var unlocked = store.get(SESSION_KEY) === '1';
  var tab = 'home';

  function render() {
    app.innerHTML = unlocked
      ? '<main>' + SCREENS[tab]() + '</main>' + navBar()
      : lockScreen();
  }

  document.addEventListener('click', function (e) {
    var hit = e.target.closest ? e.target.closest('[data-key],[data-tab]') : null;
    if (!hit) return;

    var key = hit.getAttribute('data-key');
    if (key !== null) {
      if (key === 'del') { code = code.slice(0, -1); render(); }
      else if (key === 'enter') { if (code.length === PIN_LENGTH) pinSubmit(code); }
      else pinPush(key);
      return;
    }

    var next = hit.getAttribute('data-tab');
    if (next && next !== tab) {
      tab = next;
      render();
      window.scrollTo(0, 0);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (unlocked) return;
    if (/^[0-9]$/.test(e.key)) pinPush(e.key);
    else if (e.key === 'Backspace') { code = code.slice(0, -1); render(); }
    else if (e.key === 'Enter' && code.length === PIN_LENGTH) pinSubmit(code);
  });

  render();
})();
</script>
</body>
</html>
